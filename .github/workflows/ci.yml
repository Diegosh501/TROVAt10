name: Source and release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare safe preview configuration
        run: |
          cp config.example.js config.js
          test -s TROVAT1O-Static-Preview-Pages/PREVIEW-ONLY.txt

      - name: Run source tests
        run: |
          for test_file in tests/*.cjs; do
            if [[ "$test_file" == "tests/local-postgres.cjs" ]]; then continue; fi
            node "$test_file"
          done

      - name: Verify SQL permissions and rollback on local PostgreSQL
        run: |
          mkdir -p tmp/local-postgres
          cp tests/fixtures/local-postgres/package.json tmp/local-postgres/package.json
          cp tests/fixtures/local-postgres/package-lock.json tmp/local-postgres/package-lock.json
          npm ci --prefix tmp/local-postgres --ignore-scripts --no-audit --no-fund
          node tests/local-postgres.cjs --require-engine

      - name: Install locked release tools
        working-directory: TROVAT1O-Cloudflare-Deploy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check payment functions and actual Stripe signature verification
        run: |
          npx --yes deno@2.9.6 check --frozen --lock=supabase/deno.lock supabase/functions/billing/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/admin-console/index.ts supabase/functions/host-contact/index.ts supabase/functions/push-dispatch/index.ts supabase/functions/support-request/index.ts
          npx --yes deno@2.9.6 test --frozen --lock=supabase/deno.lock tests/billing-signature.test.ts

      - name: Package release from source
        run: bash scripts/package-release.sh

      - name: Check Cloudflare bundle without publishing
        working-directory: TROVAT1O-Cloudflare-Deploy
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/trovato-worker-dry-run"

      - name: Verify release archives
        run: |
          unzip -tq TROVAT1O-Static-Preview-Pages.zip
          unzip -tq TROVAT1O-Local-Final-Preview.zip
          tar -tzf TROVAT1O-Cloudflare-Deploy/trovato-static-assets.tar.gz > "$RUNNER_TEMP/trovato-archive-files.txt"
          unzip -p TROVAT1O-Static-Preview-Pages.zip TROVAT1O-Static-Preview-Pages/PREVIEW-ONLY.txt | cmp TROVAT1O-Static-Preview-Pages/PREVIEW-ONLY.txt -
          unzip -p TROVAT1O-Static-Preview-Pages.zip TROVAT1O-Static-Preview-Pages/index.html | cmp index.html -
          unzip -p TROVAT1O-Local-Final-Preview.zip TROVAT1O-Local-Final-Preview/index.html | cmp index.html -
          unzip -p TROVAT1O-Local-Final-Preview.zip TROVAT1O-Local-Final-Preview/TROVAT1O-Cloudflare-Deploy/public/index.html | cmp index.html -
          tar -xOzf TROVAT1O-Cloudflare-Deploy/trovato-static-assets.tar.gz public/index.html | cmp index.html -
          tar -xOzf TROVAT1O-Cloudflare-Deploy/trovato-static-assets.tar.gz public/config.js | cmp config.js -
          tar -xOzf TROVAT1O-Cloudflare-Deploy/trovato-static-assets.tar.gz public/sw.js | cmp sw.js -

  postgres-integration:
    name: Native PostgreSQL concurrency and restore
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_DB: trovat1o_ci_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_synthetic_only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d trovat1o_ci_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      TROVAT1O_ISOLATED_PG_TEST: 'true'
      TROVAT1O_PG_TEST_URL: postgresql://postgres:ci_synthetic_only@127.0.0.1:5432/trovat1o_ci_control
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked native test driver
        run: |
          mkdir -p tmp/native-postgres
          cp tests/fixtures/native-postgres/package.json tmp/native-postgres/package.json
          cp tests/fixtures/native-postgres/package-lock.json tmp/native-postgres/package-lock.json
          npm ci --prefix tmp/native-postgres --ignore-scripts --no-audit --no-fund
      - name: Verify private backup encryption
        run: node tests/integration/backup-envelope.test.cjs
      - name: Replay migrations, force concurrent calls, and restore encrypted dump
        env:
          TROVAT1O_PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node tests/integration/native-postgres.cjs
